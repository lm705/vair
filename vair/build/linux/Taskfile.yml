version: '3'

includes:
  common: ../Taskfile.yml

vars:
  # Signing configuration - edit these values for your project
  # PGP_KEY: "path/to/signing-key.asc"
  # SIGN_ROLE: "builder"  # Options: origin, maint, archive, builder
  #
  # Password is stored securely in system keychain. Run: wails3 setup signing

  # Docker image for cross-compilation (used when building on non-Linux or no CC available)
  CROSS_IMAGE: wails-cross

  # Package name — lowercase, unlike APP_NAME ("Vair"). dpkg rejects a capital
  # letter in a package name outright, so these two cannot be the same string.
  PKG_NAME: vair

  # Artifact file names follow each distro's convention, which is not cosmetic:
  # a repository indexer and every "which build is this" glance read the file
  # name, and an unversioned vair.deb makes two releases indistinguishable.
  # The architecture token differs between families — deb keeps GOARCH's spelling,
  # rpm and Arch use the uname one.
  PKG_ARCH: '{{.ARCH | default ARCH}}'
  RPM_ARCH: '{{if eq (.ARCH | default ARCH) "arm64"}}aarch64{{else}}x86_64{{end}}'

tasks:
  build:
    summary: Builds the application for Linux
    cmds:
      # Linux requires CGO - use Docker when:
      # 1. Cross-compiling from non-Linux, OR
      # 2. No C compiler is available, OR
      # 3. Target architecture differs from host architecture (cross-arch compilation)
      - task: '{{if and (eq OS "linux") (eq .HAS_CC "true") (eq .TARGET_ARCH ARCH)}}build:native{{else}}build:docker{{end}}'
        vars:
          ARCH: '{{.ARCH}}'
          DEV: '{{.DEV}}'
          OUTPUT: '{{.OUTPUT}}'
          EXTRA_TAGS: '{{.EXTRA_TAGS}}'
          OBFUSCATED: '{{.OBFUSCATED}}'
          GARBLE_ARGS: '{{.GARBLE_ARGS}}'
    vars:
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}'
      OUTPUT: '{{ .OUTPUT | default .DEFAULT_OUTPUT }}'
      # Determine target architecture (defaults to host ARCH if not specified)
      TARGET_ARCH: '{{.ARCH | default ARCH}}'
      # Check if a C compiler is available (gcc or clang) — cross-platform via wails3 tool
      HAS_CC:
        sh: 'wails3 tool has "gcc|clang"'

  build:native:
    summary: Builds the application natively on Linux
    internal: true
    deps:
      - task: common:go:mod:tidy
      - task: common:build:frontend
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
          OBFUSCATED:
            ref: .OBFUSCATED
          DEV:
            ref: .DEV
      - task: common:generate:icons
    preconditions:
      - sh: '{{if eq .OBFUSCATED "true"}}command -v garble >/dev/null 2>&1{{else}}true{{end}}'
        msg: "garble is required for obfuscated builds. Install it with: go install mvdan.cc/garble@v0.16.0 (requires Go 1.24+). See https://github.com/burrowers/garble/releases for version/toolchain compatibility."
    cmds:
      - '{{if eq .OBFUSCATED "true"}}garble {{.GARBLE_ARGS}} build{{else}}go build{{end}} {{.BUILD_FLAGS}} -o {{.OUTPUT}}'
    vars:
      BUILD_FLAGS: '{{if eq .DEV "true"}}{{if or .EXTRA_TAGS (eq .OBFUSCATED "true")}}-tags {{if eq .OBFUSCATED "true"}}wails_obfuscated{{if .EXTRA_TAGS}},{{end}}{{end}}{{.EXTRA_TAGS}} {{end}}-buildvcs=false -gcflags=all="-l"{{else}}-tags production{{if eq .OBFUSCATED "true"}},wails_obfuscated{{end}}{{if .EXTRA_TAGS}},{{.EXTRA_TAGS}}{{end}} -trimpath -buildvcs=false -ldflags="-w -s"{{end}}'
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}'
      OUTPUT: '{{ .OUTPUT | default .DEFAULT_OUTPUT }}'
    env:
      GOOS: linux
      CGO_ENABLED: 1
      GOARCH: '{{.ARCH | default ARCH}}'

  build:docker:
    summary: Builds for Linux using Docker (for non-Linux hosts or when no C compiler available)
    internal: true
    deps:
      - task: common:build:frontend
        vars:
          OBFUSCATED:
            ref: .OBFUSCATED
      - task: common:generate:icons
    preconditions:
      - sh: docker info > /dev/null 2>&1
        msg: "Docker is required for cross-compilation to Linux. Please install Docker."
      - sh: docker image inspect {{.CROSS_IMAGE}} > /dev/null 2>&1
        msg: |
          Docker image '{{.CROSS_IMAGE}}' not found.
          Build it first: wails3 task setup:docker
    cmds:
      - docker run --rm -v "{{.ROOT_DIR}}:/app" {{.DOCKER_MOUNTS}} -e APP_NAME="{{.APP_NAME}}" {{if .EXTRA_TAGS}}-e EXTRA_TAGS="{{.EXTRA_TAGS}}"{{end}} {{if eq .OBFUSCATED "true"}}-e OBFUSCATED=true{{end}} {{if .GARBLE_ARGS}}-e GARBLE_ARGS="{{.GARBLE_ARGS}}"{{end}} "{{.CROSS_IMAGE}}" linux {{.DOCKER_ARCH}}
      - cmd: docker run --rm -v "{{.ROOT_DIR}}:/app" alpine chown -R $(id -u):$(id -g) /app/bin
        platforms: [linux, darwin]
      - mkdir -p {{.BIN_DIR}}
      - mv "bin/{{.APP_NAME}}-linux-{{.DOCKER_ARCH}}" "{{.OUTPUT}}"
    vars:
      DOCKER_ARCH: '{{.ARCH | default "amd64"}}'
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}'
      OUTPUT: '{{ .OUTPUT | default .DEFAULT_OUTPUT }}'
      # Generate Docker volume mounts: Go module cache + go.mod replace directives
      # Uses wails3 tool docker-mounts for cross-platform compatibility (Windows/Linux/macOS)
      DOCKER_MOUNTS:
        sh: 'wails3 tool docker-mounts'

  package:
    summary: Packages the application for Linux
    deps:
      - task: build
    cmds:
      - task: create:deb
      - task: create:rpm
      - task: create:aur

  build:helper:
    summary: Builds the privileged helper and its installer
    # CGO_ENABLED=0 on purpose, and not merely because it can be: these two run
    # as root, and a static build has no dynamic loader to point somewhere else
    # and no libc version to disagree with the machine it lands on. They import
    # nothing of vair/core, so there is nothing here that needs cgo.
    env:
      GOOS: linux
      CGO_ENABLED: 0
      GOARCH: '{{.ARCH | default ARCH}}'
    cmds:
      - go build -trimpath -ldflags="-w -s" -o {{.BIN_DIR}}/vair-helper ./helper/cmd/vair-helper
      - go build -trimpath -ldflags="-w -s" -o {{.BIN_DIR}}/vair-helper-install ./helper/cmd/vair-helper-install

  check:engines:
    summary: Fails early when the engine binaries are missing
    internal: true
    # nfpm's error for an absent src is a bare glob failure that says nothing
    # about what to do next, and the packages are useless without the engines.
    preconditions:
      - sh: test -x bin/xray && test -x bin/sing-box
        msg: |
          bin/xray and bin/sing-box are required to package.
          Fetch them with: scripts/download-engines.sh
      - sh: test -f bin/geoip.dat && test -f bin/geosite.dat
        msg: |
          The geo baselines are missing from bin/.
          Fetch them with: scripts/download-engines.sh

  # There is no AppImage target, on purpose.
  #
  # An AppImage exists to be downloaded and run with nothing installed first,
  # and on Ubuntu 24.04+ this one cannot be: the kernel there refuses
  # unprivileged user namespaces to a binary with no AppArmor profile, so
  # WebKitGTK's bubblewrap sandbox fails and the app aborts a second after
  # launch (measured — "bwrap: setting up uid map: Permission denied", then
  # "Failed to fully launch dbus-proxy"). The .deb fixes this by installing
  # /etc/apparmor.d/vair; an AppImage has no install step to do that from.
  #
  # The two ways out are both bad. Baking
  # WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS into AppRun turns the sandbox off
  # for every user of an app that renders untrusted remote content. Telling
  # users to install an AppArmor profile as root first is an install step, which
  # is the one thing an AppImage is for not having.
  #
  # Worth revisiting if the ecosystem settles this — the AppImage runtime
  # gaining a way to declare itself, or the distros shipping a blanket profile.
  # Until then this is a .deb / .rpm / AUR project, and the half-working target
  # that used to live here was only ever a trap for whoever ran it next.

  create:deb:
    summary: Creates a deb package
    deps:
      - task: build
      - task: build:helper
      - task: check:engines
    cmds:
      - task: generate:deb

  create:rpm:
    summary: Creates a rpm package
    deps:
      - task: build
      - task: build:helper
      - task: check:engines
    cmds:
      - task: generate:rpm

  create:aur:
    summary: Creates a arch linux packager package
    deps:
      - task: build
      - task: build:helper
      - task: check:engines
    cmds:
      - task: generate:aur

  generate:deb:
    summary: Creates a deb package
    cmds:
      - wails3 tool package -name "{{.PKG_NAME}}_{{.VERSION}}-1_{{.PKG_ARCH}}" -format deb -config ./build/linux/nfpm/nfpm.yaml -out {{.ROOT_DIR}}/bin
    env:
      # nfpm.yaml reads both from the environment; unset, the package version
      # becomes "" and the architecture is whatever nfpm guesses.
      VERSION: '{{.VERSION}}'
      GOARCH: '{{.ARCH | default ARCH}}'

  generate:rpm:
    summary: Creates a rpm package
    cmds:
      - wails3 tool package -name "{{.PKG_NAME}}-{{.VERSION}}-1.{{.RPM_ARCH}}" -format rpm -config ./build/linux/nfpm/nfpm.yaml -out {{.ROOT_DIR}}/bin
    env:
      # nfpm.yaml reads both from the environment; unset, the package version
      # becomes "" and the architecture is whatever nfpm guesses.
      VERSION: '{{.VERSION}}'
      GOARCH: '{{.ARCH | default ARCH}}'

  generate:aur:
    summary: Creates a arch linux packager package
    cmds:
      - wails3 tool package -name "{{.PKG_NAME}}-{{.VERSION}}-1-{{.RPM_ARCH}}" -format archlinux -config ./build/linux/nfpm/nfpm.yaml -out {{.ROOT_DIR}}/bin
    env:
      # nfpm.yaml reads both from the environment; unset, the package version
      # becomes "" and the architecture is whatever nfpm guesses.
      VERSION: '{{.VERSION}}'
      GOARCH: '{{.ARCH | default ARCH}}'

  # generate:dotdesktop is deliberately absent. The generator can only emit a
  # generic entry — no MimeType, no StartupWMClass, Categories=Development — and
  # it wrote to the same path the real file lives at, so every build silently
  # replaced it. build/linux/com.vair.app.desktop is maintained by hand.

  run:
    cmds:
      - '{{.BIN_DIR}}/{{.APP_NAME}}'
    env:
      # DEV ONLY, and it does not reach any shipped artifact.
      #
      # On Ubuntu 24.04+ an unconfined binary cannot create a user namespace, so
      # WebKitGTK's bubblewrap sandbox fails to build and WebKit aborts the
      # process seconds after launch. The packaged app solves this properly with
      # /etc/apparmor.d/vair, but that profile matches /usr/bin/vair — a binary
      # in a build tree stays unconfined no matter what.
      #
      # So the dev loop trades the WebKit sandbox away to run at all. Never put
      # this in the .desktop file, a wrapper script or a service unit: the whole
      # point of the AppArmor profile is that users get the sandbox.
      WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: '1'

  sign:deb:
    summary: Signs the DEB package
    desc: |
      Signs the .deb package with a PGP key.
      Set PGP_KEY in the vars section to override the key configured globally via
      `wails3 setup` (~/.config/wails/defaults.yaml).
      Password is retrieved from system keychain (run: wails3 setup signing)
    deps:
      - task: create:deb
    cmds:
      # PGP_KEY is optional: if unset, `wails3 tool sign` falls back to the key
      # configured globally via `wails3 setup`.
      - wails3 tool sign --input "{{.BIN_DIR}}/{{.PKG_NAME}}*.deb" {{if .PGP_KEY}}--pgp-key "{{.PGP_KEY}}"{{end}} {{if .SIGN_ROLE}}--role "{{.SIGN_ROLE}}"{{end}}

  sign:rpm:
    summary: Signs the RPM package
    desc: |
      Signs the .rpm package with a PGP key.
      Set PGP_KEY in the vars section to override the key configured globally via
      `wails3 setup` (~/.config/wails/defaults.yaml).
      Password is retrieved from system keychain (run: wails3 setup signing)
    deps:
      - task: create:rpm
    cmds:
      - wails3 tool sign --input "{{.BIN_DIR}}/{{.PKG_NAME}}*.rpm" {{if .PGP_KEY}}--pgp-key "{{.PGP_KEY}}"{{end}}

  sign:packages:
    summary: Signs all Linux packages (DEB and RPM)
    desc: |
      Signs both .deb and .rpm packages with a PGP key.
      Set PGP_KEY in the vars section to override the key configured globally via
      `wails3 setup` (~/.config/wails/defaults.yaml).
      Password is retrieved from system keychain (run: wails3 setup signing)
    cmds:
      - task: sign:deb
      - task: sign:rpm
